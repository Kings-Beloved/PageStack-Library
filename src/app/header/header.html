<!-- Main Header -->
<header class="sticky-top" style="background-color: #121212; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
  <div class="container py-2">
    <div class="d-flex align-items-center justify-content-between">
      
      <!-- Brand Logo -->
      <a class="navbar-brand fw-bold fs-3 text-white text-decoration-none" href="#">
        Page<span style="color: #D4AF37;">Stack</span>
      </a>

      <!-- Desktop Actions (Login & Signup) -->
      <div class="d-none d-md-flex align-items-center gap-2">
        <a 
          routerLink="/login" routerLinkActive="active" 
          class="btn btn-sm rounded-pill px-3 py-1 fw-semibold text-uppercase"
          style="border: 1.5px solid #D4AF37; color: #D4AF37; font-size: 0.8rem;"
        >
          LOGIN
        </a>
        <a 
          routerLink="/signUp" routerLinkActive="active"
          class="btn btn-sm rounded-pill px-3 py-1 fw-semibold text-uppercase text-white"
          style="background-color: #D4AF37; border: 1.5px solid #D4AF37; font-size: 0.8rem;"
        >
          SIGNUP
        </a>
      </div>

      <!-- Mobile Controls (Hamburger Button Only) -->
      <div class="d-flex d-md-none align-items-center">
        <button 
          class="btn border-0 p-0 text-white" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#mobileMenu"
          aria-expanded="false"
        >
          <i class="bi bi-list fs-1" style="color: #D4AF37;"></i>
        </button>
      </div>

    </div>

    <!-- Collapsible Mobile Menu -->
    <div class="collapse d-md-none mt-3 border-top pt-3" id="mobileMenu" style="border-color: rgba(255, 255, 255, 0.1) !important;">
      <div class="d-flex flex-column gap-2">
        <div class="d-flex gap-2 mb-2">
          <a routerLink="/login" routerLinkActive="active" class="btn btn-sm w-50 rounded-pill py-2 text-center text-uppercase fw-semibold" style="border: 1.5px solid #D4AF37; color: #D4AF37;">Login</a>
          <a routerLink="/signUp" routerLinkActive="active" class="btn btn-sm w-50 rounded-pill py-2 text-center text-uppercase text-dark fw-semibold" style="background-color: #D4AF37;">Signup</a>
        </div>
        <a routerLink="/homepage" fragment="catalog" class="text-decoration-none fw-semibold py-2 border-bottom" style="color: #D4AF37; border-color: rgba(255,255,255,0.08) !important;">BROWSE CATALOG</a>
        <a routerLink="/dashboard" routerLinkActive="active" class="text-decoration-none text-light fw-semibold py-2 border-bottom" style="border-color: rgba(255,255,255,0.08) !important;">MY LIBRARY</a>
        <a routerLink="/disclaimer" routerLinkActive="active" class="text-decoration-none text-light fw-semibold py-2">HOW IT WORKS</a>
        <a routerLink="/aboutUs" routerLinkActive="active" class="text-decoration-none text-light fw-semibold py-2 border-bottom" style="border-color: rgba(255,255,255,0.08) !important;">ABOUT US</a>
        <a routerLink="/donate" routerLinkActive="active" class="text-decoration-none text-light fw-semibold py-2 border-bottom" style="border-color: rgba(255,255,255,0.08) !important;">DONATE</a>
      </div>
    </div>

  </div>

  <!-- Desktop Category Links -->
  <nav class="container mt-2 d-none d-md-block border-top pt-2" style="border-color: rgba(255, 255, 255, 0.1) !important;">
    <div class="d-flex justify-content-start gap-4 small fw-semibold text-uppercase pb-2">
      <!-- Browse Catalog (Jumps directly to #catalog section on Homepage) -->
      <a class="text-decoration-none text-light transition-link" routerLink="/dashboard" fragment="catalog">Browse Catalog</a>

      <!-- Protected My Library Route -->
      <a class="text-decoration-none text-light transition-link" routerLink="/dashboard" routerLinkActive="active">My Library</a>

      <!-- Donate Page -->
      
      <!-- User Support -->
      <a class="text-decoration-none text-light transition-link" routerLink="/howitworks" routerLinkActive="active">HOW IT WORKS</a>
      
      <!-- About Us -->
      <a class="text-decoration-none text-light transition-link" routerLink="/aboutUs" routerLinkActive="active">About Us</a>

      <a class="text-decoration-none text-light transition-link" routerLink="/donate" routerLinkActive="active">Donate</a>

    </div>
  </nav>
</header>
